<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Typer</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
select,input,button,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{flex:1;min-width:0}
button{cursor:pointer}
button.p{background:var(--acc);color:#04283b;border-color:var(--acc);font-weight:600}
main{padding:12px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:14px 4px;font-size:13px}
nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:4px}
.teams{font-weight:600;margin-bottom:8px}
.cols,.row{display:grid;grid-template-columns:18px 1fr 42px 42px 42px 42px;gap:6px;align-items:center;font-size:13px}
.cols{color:var(--mut);font-size:11px;margin-bottom:2px}
.cols span,.row span{text-align:right}
.row{margin:3px 0;padding:2px 0}
.row.hi{background:rgba(251,191,36,.12);border-radius:6px}
.row.hi .e{color:var(--warn);font-weight:700}
.sub.warn{color:var(--warn)}
.bar{position:relative;height:8px;background:#0f172a;border-radius:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:4px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn)}
.m{color:var(--warn)}
.sub{color:var(--mut);font-size:12px;margin-top:6px}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:99px;font-size:13px}
.chips button.on{background:var(--acc);color:#04283b;border-color:var(--acc)}
.err{color:var(--bad)}
.mut{color:var(--mut)}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input{width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
.foot{color:var(--mut);font-size:11px;text-align:center;margin:18px 0}
</style>
</head>
<body>
<header>
  <select id="lg"></select>
  <button id="rf" class="p">Odśwież</button>
</header>
<main id="v"></main>
<nav id="nav">
  <button data-t="fx" class="on">Mecze</button>
  <button data-t="cu">Własny mecz</button>
  <button data-t="bt">Backtest</button>
  <button data-t="st">Ustawienia</button>
</nav>

<script>
//CORE_START
const pad=n=>String(n).padStart(2,'0');
function seasonCode(off=0){const n=new Date();let s=n.getMonth()>=6?n.getFullYear():n.getFullYear()-1;s+=off;return pad(s%100)+pad((s+1)%100);}
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');
  const lines=t.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const split=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch==','&&!q){o.push(c);c='';}else c+=ch;}o.push(c);return o;};
  const h=split(lines[0]).map(x=>x.trim());
  return lines.slice(1).map(l=>{const v=split(l),o={};h.forEach((k,i)=>o[k]=(v[i]||'').trim());return o;});
}
function pDate(s,tm){
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s||'');if(!m)return null;
  let y=+m[3];if(y<100)y+=2000;
  const p=(tm||'').split(':');
  return new Date(Date.UTC(y,+m[2]-1,+m[1],+(p[0]||12),+(p[1]||0)));
}
const num=x=>{const v=parseFloat(x);return isFinite(v)?v:null;};
function norm(r){
  const d=pDate(r.Date,r.Time);if(!d||!r.HomeTeam||!r.AwayTeam)return null;
  const o=(a,b,c)=>{const x=[num(r[a]),num(r[b]),num(r[c])];return x.every(v=>v!==null&&v>1)?x:null;};
  return {div:r.Div,d,h:r.HomeTeam,a:r.AwayTeam,hg:num(r.FTHG),ag:num(r.FTAG),
    avg:o('AvgH','AvgD','AvgA')||o('B365H','B365D','B365A'),
    avgc:o('AvgCH','AvgCD','AvgCA')||o('PSCH','PSCD','PSCA'),
    max:o('MaxH','MaxD','MaxA'),
    ov:num(r['Avg>2.5'])||num(r['B365>2.5']),un:num(r['Avg<2.5'])||num(r['B365<2.5'])};
}
function ratings(ms,asOf,half){
  let sw=0,sh=0,sa=0,nm=0;const T={};
  for(const m of ms){
    if(m.hg===null||m.d>=asOf)continue;
    const w=Math.pow(0.5,((asOf-m.d)/864e5)/half);
    sw+=w;nm++;sh+=w*m.hg;sa+=w*m.ag;
    const H=T[m.h]||(T[m.h]={gf:0,ga:0,w:0}),A=T[m.a]||(T[m.a]={gf:0,ga:0,w:0});
    H.gf+=w*m.hg;H.ga+=w*m.ag;H.w+=w;A.gf+=w*m.ag;A.ga+=w*m.hg;A.w+=w;
  }
  if(sw<5)return null;
  const hAvg=sh/sw,aAvg=sa/sw,mu=(hAvg+aAvg)/2,h=Math.sqrt(hAvg/aAvg),K=6;
  for(const t in T){T[t].att=((T[t].gf+K*mu)/(T[t].w+K))/mu;T[t].def=((T[t].ga+K*mu)/(T[t].w+K))/mu;}
  return {T,mu,h,hAvg,aAvg,nm};
}
function pmf(l,n=10){const p=[Math.exp(-l)];for(let k=1;k<=n;k++)p.push(p[k-1]*l/k);return p;}
function predict(R,h,a){
  const th=R.T[h]||{att:1,def:1},ta=R.T[a]||{att:1,def:1};
  const lh=R.mu*R.h*th.att*ta.def,la=R.mu/R.h*ta.att*th.def;
  const ph=pmf(lh),pa=pmf(la);let H=0,D=0,A=0,o=0,b=0,tot=0;const sc=[];
  for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){
    const p=ph[i]*pa[j];tot+=p;
    if(i>j)H+=p;else if(i==j)D+=p;else A+=p;
    if(i+j>2)o+=p;if(i>0&&j>0)b+=p;sc.push([i,j,p]);
  }
  sc.sort((x,y)=>y[2]-x[2]);
  return {lh,la,pH:H/tot,pD:D/tot,pA:A/tot,o25:o/tot,btts:b/tot,top:sc.slice(0,3).map(x=>[x[0],x[1],x[2]/tot])};
}
const imp=o=>{const q=o.map(x=>1/x),s=q[0]+q[1]+q[2];return q.map(x=>x/s);};
const mse=a=>{const n=a.length;if(n<2)return{m:0,se:0,n};const m=a.reduce((x,y)=>x+y,0)/n;const v=a.reduce((x,y)=>x+(y-m)*(y-m),0)/(n-1);return{m,se:Math.sqrt(v/n),n};};
function btRecords(ms,from,half,minPrior=100){
  const cur=ms.filter(m=>m.d>=from&&m.hg!==null).sort((a,b)=>a.d-b.d);
  const out=[];
  const sl=m=>{const y=m.d.getUTCFullYear(),s=m.d.getUTCMonth()>=6?y:y-1;return s+'/'+pad((s+1)%100);};
  for(const m of cur){
    const R=ratings(ms,m.d,half);if(!R||R.nm<minPrior)continue;
    const p=predict(R,m.h,m.a),y=m.hg>m.ag?0:m.hg==m.ag?1:2;
    const ob=m.avg||m.avgc,oc=m.avgc||m.avg;
    out.push({k:sl(m),P:[p.pH,p.pD,p.pA],y,ob:ob||null,Qb:ob?imp(ob):null,Qc:oc?imp(oc):null});
  }
  return out;
}
const blend=(P,Q,w)=>Q?P.map((x,i)=>(1-w)*x+w*Q[i]):P;
function btEval(recs,w,thr){
  const r={n:0,llM:0,llMk:0,brM:0,hitM:0,nk:0,llK:0,brK:0,hitK:0,bets:0,pl:0,dll:[],ret:[],by:{},
    bk:[{l:'kurs < 2,0',hi:2,n:0,pl:0},{l:'kurs 2,0–3,5',hi:3.5,n:0,pl:0},{l:'kurs > 3,5',hi:1e9,n:0,pl:0}]};
  const br=(P,y)=>P.reduce((s,x,i)=>s+(x-(i==y?1:0))**2,0);
  const am=P=>P.indexOf(Math.max(...P));
  for(const c of recs){
    const P=blend(c.P,c.Qb,w),y=c.y;
    const B=r.by[c.k]||(r.by[c.k]={n:0,nk:0,llMk:0,llK:0,bets:0,pl:0});
    const lm=-Math.log(Math.max(P[y],1e-9));
    r.n++;B.n++;r.llM+=lm;r.brM+=br(P,y);if(am(P)==y)r.hitM++;
    if(c.Qc){const Q=c.Qc,lk=-Math.log(Q[y]);r.nk++;B.nk++;r.llMk+=lm;B.llMk+=lm;r.llK+=lk;B.llK+=lk;r.brK+=br(Q,y);if(am(Q)==y)r.hitK++;r.dll.push(lm-lk);}
    if(c.ob)for(let i=0;i<3;i++){if(P[i]*c.ob[i]-1>=thr){const g=i==y?c.ob[i]-1:-1;r.bets++;r.pl+=g;B.bets++;B.pl+=g;r.ret.push(g);const b=r.bk.find(x=>c.ob[i]<x.hi);b.n++;b.pl+=g;}}
  }
  return r;
}
function backtest(ms,from,half,thr,minPrior=100,w=0){return btEval(btRecords(ms,from,half,minPrior),w,thr);}
//CORE_END

/* ---------- UI ---------- */
const LG={E0:'Anglia – Premier League',E1:'Anglia – Championship',E2:'Anglia – League One',E3:'Anglia – League Two',SC0:'Szkocja – Premiership',D1:'Niemcy – Bundesliga',D2:'Niemcy – 2. Bundesliga',I1:'Włochy – Serie A',I2:'Włochy – Serie B',SP1:'Hiszpania – La Liga',SP2:'Hiszpania – La Liga 2',F1:'Francja – Ligue 1',F2:'Francja – Ligue 2',N1:'Holandia – Eredivisie',B1:'Belgia – Pro League',P1:'Portugalia – Liga',T1:'Turcja – Süper Lig',G1:'Grecja – Super League'};
const BASE='https://www.football-data.co.uk/';
const DEF={proxy:'https://gentle-fire-cbb1.nicwaznego2011.workers.dev/?url=',half:180,thr:5,thrPP:8,w:0.8,proxyOnly:false,div:'E0'};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('typer')||'{}'));}catch(e){}
const save=()=>{try{localStorage.setItem('typer',JSON.stringify(S));}catch(e){}};
let tab='fx',sortBy='date',busy=false,msg='';
const mem={txt:{},manual:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=x=>(x*100).toFixed(0)+'%';

async function getText(url){
  if(mem.txt[url])return mem.txt[url];
  const tries=[];
  if(!S.proxyOnly)tries.push(url);
  if(S.proxy)tries.push(S.proxy+encodeURIComponent(url));
  let err=new Error('brak źródła');
  for(const u of tries){
    try{const r=await fetch(u);if(r.ok){const t=await r.text();if(t.includes(',')&&t.length>100){mem.txt[url]=t;return t;}}err=new Error('HTTP '+r.status);}
    catch(e){err=e;}
  }
  throw err;
}
const toMatches=t=>parseCSV(t).map(norm).filter(Boolean);

async function loadLeague(div){
  if(mem.manual){
    const all=mem.manual.filter(m=>!m.div||m.div==div);
    return {res:all.filter(m=>m.hg!==null),fx:all.filter(m=>m.hg===null)};
  }
  const [c,p,f]=await Promise.allSettled([
    getText(`${BASE}mmz4281/${seasonCode(0)}/${div}.csv`),
    getText(`${BASE}mmz4281/${seasonCode(-1)}/${div}.csv`),
    getText(`${BASE}fixtures.csv`)]);
  if(c.status!='fulfilled'&&p.status!='fulfilled')throw c.reason;
  const res=[];
  if(p.status=='fulfilled')res.push(...toMatches(p.value));
  if(c.status=='fulfilled')res.push(...toMatches(c.value));
  const fx=f.status=='fulfilled'?toMatches(f.value).filter(m=>m.div==div&&m.hg===null):[];
  return {res:res.filter(m=>m.hg!==null),fx};
}

async function loadHist(d){
  if(d.hist)return d.hist;
  if(mem.manual){d.hist=d.res;return d.hist;}
  const rs=await Promise.allSettled([-2,-3,-4,-5,-6].map(k=>getText(`${BASE}mmz4281/${seasonCode(k)}/${d.div}.csv`)));
  const old=[];
  rs.forEach(r=>{if(r.status=='fulfilled')old.push(...toMatches(r.value).filter(m=>m.hg!==null));});
  d.hist=old.concat(d.res);
  return d.hist;
}

let D=null; // {div,res,fx,R}
async function ensure(){
  if(D&&D.div==S.div)return D;
  const d=await loadLeague(S.div);
  const R=ratings(d.res,new Date(Date.now()+864e5),S.half);
  D={div:S.div,res:d.res,fx:d.fx.sort((a,b)=>a.d-b.d),R};
  return D;
}

function rowsHtml(P,odds,Q){
  const L=['1','X','2'];
  return `<div class="cols"><span></span><span></span><span>Model</span><span>Rynek</span><span>Kurs</span><span>Różn.</span></div>`+
  L.map((l,i)=>{
    const d=Q?(P[i]-Q[i])*100:null,hi=d!==null&&Math.abs(d)>=S.thrPP;
    return `<div class="row ${hi?'hi':''}"><b>${l}</b><div class="bar"><i style="width:${P[i]*100}%"></i>${Q?`<u style="left:${Q[i]*100}%"></u>`:''}</div><span>${pc(P[i])}</span><span class="m">${Q?pc(Q[i]):'–'}</span><span>${odds?odds[i].toFixed(2):'–'}</span><span class="e">${d!==null?(d>=0?'+':'')+d.toFixed(0):''}</span></div>`;
  }).join('');
}
const maxDiff=(p,Q)=>Q?Math.max(Math.abs(p.pH-Q[0]),Math.abs(p.pD-Q[1]),Math.abs(p.pA-Q[2]))*100:-1;
function mixLine(P,Q,odds){
  if(!Q||!odds)return '';
  const B=blend(P,Q,S.w);
  return `<br>Miks z rynkiem (waga ${Math.round(S.w*100)}%): `+['1','X','2'].map((l,i)=>{const e=(B[i]*odds[i]-1)*100;return `${l} ${pc(B[i])} (edge ${e>=0?'+':''}${e.toFixed(0)}%)`;}).join(' · ');
}

function card(f,R){
  const p=predict(R,f.h,f.a),P=[p.pH,p.pD,p.pA],Q=f.avg?imp(f.avg):null;
  const dt=f.d.toLocaleString('pl-PL',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Warsaw'});
  let ou;
  if(f.ov&&f.un){const qo=(1/f.ov)/(1/f.ov+1/f.un);ou=` · Over 2.5: model ${pc(p.o25)}, rynek ${pc(qo)} (kurs ${f.ov.toFixed(2)})`;}
  else ou=` · Over 2.5: model ${pc(p.o25)}`;
  const warn=maxDiff(p,Q)>=S.thrPP?`<div class="sub warn">⚠ Duża różnica z rynkiem (≥ ${S.thrPP} p.p.) – sprawdź skład, kontuzje i rotację przed decyzją.</div>`:'';
  return `<div class="card"><div class="hd"><span>${dt}</span><span>xG ${p.lh.toFixed(2)} : ${p.la.toFixed(2)}</span></div>
  <div class="teams">${esc(f.h)} – ${esc(f.a)}</div>${rowsHtml(P,f.avg,Q)}
  <div class="sub">Wyniki: ${p.top.map(t=>`${t[0]}:${t[1]} (${pc(t[2])})`).join(', ')}<br>BTTS ${pc(p.btts)}${ou}${mixLine(P,Q,f.avg)}</div>${warn}</div>`;
}

async function view(){
  const v=$('v');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  if(tab=='st')return settings();
  v.innerHTML='<p class="mut">Ładowanie danych…</p>';
  let d;
  try{d=await ensure();}
  catch(e){v.innerHTML=`<p class="err">Nie udało się pobrać danych (${esc(e.message)}).</p><p class="mut">football-data.co.uk nie wysyła nagłówków CORS, więc przeglądarka potrzebuje proxy (Cloudflare Worker) albo wgraj pliki CSV ręcznie w Ustawieniach.</p>`;return;}
  if(!d.R){v.innerHTML='<p class="err">Za mało rozegranych meczów, żeby zbudować model.</p>';return;}
  if(tab=='fx')fixtures(d);else if(tab=='cu')custom(d);else if(tab=='bt')bt(d);
}

function fixtures(d){
  let fx=d.fx.slice();
  const dif=f=>maxDiff(predict(d.R,f.h,f.a),f.avg?imp(f.avg):null);
  if(sortBy=='diff')fx.sort((a,b)=>dif(b)-dif(a));
  const nHi=fx.filter(f=>dif(f)>=S.thrPP).length;
  $('v').innerHTML=`<div class="chips"><button data-s="date" class="${sortBy=='date'?'on':''}">Wg daty</button><button data-s="diff" class="${sortBy=='diff'?'on':''}">Wg różnicy z rynkiem</button></div>
  <p class="mut" style="margin:0 0 6px">${fx.length} nadchodzących meczów · ${nHi} z różnicą ≥ ${S.thrPP} p.p. · model z ${d.res.length} meczów</p>
  <p class="sub" style="margin:0 0 10px">Podświetlenie oznacza, że model różni się od rynku. W backteście rynek był trafniejszy od samego modelu, więc traktuj to jako powód do sprawdzenia składów i kontuzji, a nie sygnał do obstawiania.</p>`+
  (fx.length?fx.map(f=>card(f,d.R)).join(''):'<p class="mut">Brak nadchodzących meczów w fixtures.csv dla tej ligi (przerwa reprezentacyjna / koniec sezonu). Użyj zakładki „Własny mecz”.</p>')+
  '<div class="foot">Model statystyczny – nie gwarancja wyniku. Graj odpowiedzialnie.</div>';
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sortBy=b.dataset.s;fixtures(d);});
}

function custom(d){
  const teams=Object.keys(d.R.T).sort();
  const opt=s=>teams.map(t=>`<option ${t==s?'selected':''}>${esc(t)}</option>`).join('');
  $('v').innerHTML=`<div class="card"><div class="g2"><div><label>Gospodarz</label><select id="ch">${opt(teams[0])}</select></div><div><label>Gość</label><select id="ca">${opt(teams[1])}</select></div></div>
  <label>Twoje kursy (opcjonalnie): 1 / X / 2</label><div class="g3"><input id="o1" inputmode="decimal" placeholder="1"><input id="o2" inputmode="decimal" placeholder="X"><input id="o3" inputmode="decimal" placeholder="2"></div></div><div id="co"></div>`;
  const go=()=>{
    const h=$('ch').value,a=$('ca').value;
    if(h==a){$('co').innerHTML='<p class="mut">Wybierz dwie różne drużyny.</p>';return;}
    const p=predict(d.R,h,a),P=[p.pH,p.pD,p.pA],o=[1,2,3].map(i=>num($('o'+i).value.replace(',','.')));
    const odds=o.every(x=>x&&x>1)?o:null,Q=odds?imp(odds):null;
    const warn=maxDiff(p,Q)>=S.thrPP?`<div class="sub warn">⚠ Duża różnica z rynkiem (≥ ${S.thrPP} p.p.) – sprawdź skład, kontuzje i rotację przed decyzją.</div>`:'';
    $('co').innerHTML=`<div class="card"><div class="hd"><span>Teren: ${esc(h)}</span><span>xG ${p.lh.toFixed(2)} : ${p.la.toFixed(2)}</span></div>${rowsHtml(P,odds,Q)}
    <div class="sub">Wyniki: ${p.top.map(t=>`${t[0]}:${t[1]} (${pc(t[2])})`).join(', ')}<br>BTTS ${pc(p.btts)} · Over 2.5 ${pc(p.o25)} · Under 2.5 ${pc(1-p.o25)}${mixLine(P,Q,odds)}</div>${warn}</div>`;
  };
  ['ch','ca','o1','o2','o3'].forEach(id=>$(id).oninput=go);go();
}

async function bt(d){
  $('v').innerHTML='<p class="mut">Ładowanie historii sezonów…</p>';
  const ms=await loadHist(d);
  if(tab!='bt')return;
  const now=new Date(),yr=now.getUTCMonth()>=6?now.getUTCFullYear():now.getUTCFullYear()-1;
  const recs=btRecords(ms,new Date(Date.UTC(yr-5,6,1)),S.half,100);
  if(!recs.length){$('v').innerHTML='<p class="mut">Za mało danych do backtestu.</p>';return;}
  const f=(x,n)=>x.toFixed(n),sg=x=>(x>=0?'+':'')+x.toFixed(1),thr=S.thr/100;
  const ev=w=>btEval(recs,w,thr);
  const r0=ev(0),rw=ev(S.w);
  const ws=[0,0.25,0.5,0.7,0.8,0.9,1];
  if(!ws.includes(S.w)){ws.push(S.w);ws.sort((a,b)=>a-b);}
  const grid=ws.map(w=>{const r=ev(w);return{w,r,dm:mse(r.dll),ll:r.nk?r.llMk/r.nk:NaN};});
  const best=grid.reduce((a,b)=>b.ll<a.ll?b:a),g1=grid.find(g=>g.w==1);
  const seasons=Object.keys(rw.by).sort();
  const dm0=mse(r0.dll),dci0=2*dm0.se,rm=mse(rw.ret),roi=rm.m*100,rci=2*rm.se*100,wl=Math.round(S.w*100);
  const vLL=Math.abs(dm0.m)<=dci0?'różnica w granicach szumu – brak dowodu, że model bije rynek':(dm0.m<0?'model lepszy od rynku poza szumem – sprawdź, czy to się powtarza w każdym sezonie':'model gorszy od rynku poza szumem – sam model nie nadaje się do szukania „value”');
  const vROI=rw.bets<2?'':(Math.abs(roi)<=rci?'wynik w granicach szumu':(roi>0?'dodatni poza szumem – zweryfikuj na kolejnych sezonach':'ujemny poza szumem'));
  const verdict=best.w==1?'Najniższy log loss ma sam rynek – dołożenie modelu nie poprawiło wyniku na tych danych.':`Najlepsza waga rynku: ${Math.round(best.w*100)}% (log loss ${f(best.ll,3)} vs ${f(g1.ll,3)} dla samych kursów). To dopasowanie na tych samych danych, więc na przyszłość poprawa będzie zwykle mniejsza.`;
  $('v').innerHTML=`<div class="card"><div class="teams">Sam model vs rynek – ${seasons.length} sezon(y), ${r0.n} meczów</div>
  <p class="mut" style="margin-top:0">Każdy mecz przewidziany wyłącznie na podstawie meczów rozegranych przed nim (min. 100 wcześniejszych). Benchmark: kursy zamknięcia rynku bez marży.</p>
  <table><tr><th></th><th>Model</th><th>Rynek</th></tr>
  <tr><td>Mecze z kursami</td><td>${r0.nk}</td><td>${r0.nk}</td></tr>
  <tr><td>Log loss ↓</td><td>${r0.nk?f(r0.llMk/r0.nk,3):'–'}</td><td>${r0.nk?f(r0.llK/r0.nk,3):'–'}</td></tr>
  <tr><td>Brier ↓</td><td>${f(r0.brM/r0.n,3)}</td><td>${r0.nk?f(r0.brK/r0.nk,3):'–'}</td></tr>
  <tr><td>Trafność typu</td><td>${pc(r0.hitM/r0.n)}</td><td>${r0.nk?pc(r0.hitK/r0.nk):'–'}</td></tr></table>
  <div class="sub"><b>Różnica log loss (model − rynek): ${dm0.m>=0?'+':''}${f(dm0.m,3)} ± ${f(dci0,3)}</b> (±2 błędy std.)<br>${vLL}.</div></div>
  <div class="card"><div class="teams">Miks modelu z rynkiem</div>
  <p class="mut" style="margin-top:0">Szacunek = w × rynek + (1 − w) × model. Rynek to kursy, po których byś obstawiał (sprzed zamknięcia), porównanie z kursami zamknięcia. Przy wadze 100% wynik jest więc nieco gorszy od zamknięcia.</p>
  <table><tr><th>Waga rynku</th><th>Log loss</th><th>Różn. vs zamkn.</th><th>Zakł.</th><th>ROI</th></tr>
  ${grid.map(g=>`<tr><td>${Math.round(g.w*100)}%${g.w==best.w?' ★':''}${g.w==S.w?' ◀':''}</td><td>${f(g.ll,3)}</td><td>${g.dm.m>=0?'+':''}${f(g.dm.m,3)} ± ${f(2*g.dm.se,3)}</td><td>${g.r.bets}</td><td>${g.r.bets?sg(g.r.pl/g.r.bets*100)+'%':'–'}</td></tr>`).join('')}</table>
  <div class="sub">★ najniższy log loss · ◀ ustawiona waga. ${verdict}</div>
  ${best.w!=S.w?`<p><button class="p" id="bw">Ustaw wagę ${Math.round(best.w*100)}%</button></p>`:''}</div>
  <div class="card"><div class="teams">Wg sezonów (waga rynku ${wl}%)</div>
  <table><tr><th>Sezon</th><th>Mecze</th><th>LL miks</th><th>LL rynek</th><th>ROI</th></tr>
  ${seasons.map(k=>{const B=rw.by[k];return `<tr><td>${k}</td><td>${B.n}</td><td>${B.nk?f(B.llMk/B.nk,3):'–'}</td><td>${B.nk?f(B.llK/B.nk,3):'–'}</td><td>${B.bets?sg(B.pl/B.bets*100)+'%':'–'}</td></tr>`;}).join('')}</table></div>
  <div class="card"><div class="teams">Symulacja zakładów (waga rynku ${wl}%, edge ≥ ${S.thr}%, stawka 1)</div>
  <table><tr><td>Zakładów</td><td>${rw.bets}</td></tr><tr><td>Bilans</td><td>${rw.pl>=0?'+':''}${f(rw.pl,1)}</td></tr>
  <tr><td>ROI</td><td>${rw.bets?sg(roi)+'% ± '+f(rci,1)+' p.p.':'–'}</td></tr></table>
  <div class="sub">${vROI?vROI+'.':''} Przy wysokiej wadze rynku zakładów jest mało, bo edge względem własnych kursów rzadko przekracza próg.</div>
  <div class="teams" style="margin-top:12px">ROI wg kursu typu</div>
  <table><tr><th>Przedział</th><th>Zakładów</th><th>ROI</th></tr>
  ${rw.bk.map(b=>`<tr><td>${b.l}</td><td>${b.n}</td><td>${b.n?sg(b.pl/b.n*100)+'%':'–'}</td></tr>`).join('')}</table>
  <div class="sub">Jeśli cały zysk siedzi w kursach &gt; 3,5, to zwykle kilka trafionych outsiderów, a nie przewaga modelu. Kursy z pliku to średnia rynku sprzed zamknięcia, bez limitów stawek i ruchu kursu.</div></div>`;
  const bw=$('bw');if(bw)bw.onclick=()=>{S.w=best.w;save();bt(d);};
}

function settings(){
  $('v').innerHTML=`<div class="card"><label>Proxy CORS (prefiks, URL doklejany na końcu)</label><input id="sp" value="${esc(S.proxy)}" placeholder="https://twoj-worker.workers.dev/?url=">
  <label><input type="checkbox" id="spo" ${S.proxyOnly?'checked':''} style="width:auto"> Zawsze używaj proxy (pomiń próbę bezpośrednią)</label>
  <div class="g2"><div><label>Waga rynku w miksie (0–1)</label><input id="sw" inputmode="decimal" value="${S.w}"></div><div><label>Podświetl różnicę z rynkiem od (p.p.)</label><input id="sdp" type="number" step="1" value="${S.thrPP}"></div></div>
  <div class="g2"><div><label>Okres połowicznego zaniku wagi (dni)</label><input id="sh" type="number" value="${S.half}"></div><div><label>Próg edge w symulacji backtestu (%)</label><input id="st" type="number" step="0.5" value="${S.thr}"></div></div>
  <p><button class="p" id="ss">Zapisz</button> <span id="sm" class="mut"></span></p></div>
  <div class="card"><div class="teams">Wgraj CSV ręcznie</div><p class="mut" style="margin-top:0">Gdy proxy nie działa: pobierz pliki z football-data.co.uk (sezon + fixtures.csv) i wskaż je tutaj. Mecze z wynikiem trafiają do modelu, bez wyniku – do listy nadchodzących.</p>
  <input type="file" id="sf" accept=".csv" multiple><p class="mut" id="sfm"></p>${mem.manual?'<button id="sx">Wróć do pobierania z sieci</button>':''}</div>`;
  $('ss').onclick=()=>{
    S.proxy=$('sp').value.trim();S.proxyOnly=$('spo').checked;
    const w=parseFloat($('sw').value.replace(',','.'));S.w=isFinite(w)?Math.min(1,Math.max(0,w)):DEF.w;
    S.thrPP=Math.max(1,+$('sdp').value||DEF.thrPP);
    S.half=Math.max(30,+$('sh').value||DEF.half);S.thr=+$('st').value||DEF.thr;
    save();D=null;$('sm').textContent='Zapisano';
  };
  $('sf').onchange=async e=>{
    let all=[];for(const f of e.target.files)all.push(...toMatches(await f.text()));
    mem.manual=all;D=null;$('sfm').textContent=`Wczytano ${all.length} wierszy.`;
  };
  if($('sx'))$('sx').onclick=()=>{mem.manual=null;D=null;settings();};
}

$('lg').innerHTML=Object.entries(LG).map(([k,v])=>`<option value="${k}" ${k==S.div?'selected':''}>${v}</option>`).join('');
$('lg').onchange=()=>{S.div=$('lg').value;save();view();};
$('rf').onclick=()=>{mem.txt={};D=null;view();};
$('nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;view();}};
view();
</script>
